# The ACP endpoint binds 0.0.0.0, so it requires a secret key; a random one is
# generated and printed per launch unless MAYHEM_SERVER__SECRET_KEY is set.
run:
  - name: ACP Server
    command: 'export MAYHEM_SERVER__SECRET_KEY="${MAYHEM_SERVER__SECRET_KEY:-$(openssl rand -hex 32)}"; echo "ACP secret key: $MAYHEM_SERVER__SECRET_KEY"; exec mayhem serve --platform desktop --host 0.0.0.0 --port 3284'
    port: 3284
